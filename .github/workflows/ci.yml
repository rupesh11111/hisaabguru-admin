name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Matches the Dockerfile's node:24-alpine. npm 11 also matches the lockfile.
  NODE_VERSION: '24'

jobs:
  lint-typecheck-build:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Catches broken .tsx, bad next.config or a missing dep here rather than
      # halfway through the Docker build.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://hisaabguru.up.railway.app/api/v1

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    # The image build repeats the Next build, so only run it once the cheap
    # checks are green.
    needs: lint-typecheck-build
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only — publishing is left to the deploy platform, which builds
      # from this same Dockerfile.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: hisaabguru-admin:ci
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://hisaabguru.up.railway.app/api/v1
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A green image build still says nothing about whether the server boots —
      # a wrong HOSTNAME or a missing static/ copy only shows up at runtime.
      - name: Smoke test the container
        run: |
          docker run -d --name admin-ci -p 3100:3100 hisaabguru-admin:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3100/api/health; then
              echo "container healthy"; exit 0
            fi
            sleep 2
          done
          echo "Container never became healthy:"
          docker logs admin-ci
          exit 1
